[package]
name = "r-x-badpix"
version = "0.2.0"
edition = "2024"

[dependencies]
dicom-core = "0.10.0"
dicom-object = "0.10.0"
dicom-pixeldata = "0.10.0"
eframe = "0.36.2"
egui = "0.36.2"
egui_extras = { version = "0.36.2", features = ["svg"] }
image = { version = "0.25.10", features = ["tiff"] }
js-sys = "0.3.103"
rfd = "0.17.2"
wasm-bindgen-futures = "0.4.76"
web-sys = { version = "0.3.103", features = [
	"Blob",
	"Document",
	"Event",
	"EventTarget",
	"File",
	"FileList",
	"FileReader",
	"HtmlCanvasElement",
	"HtmlElement",
	"HtmlInputElement",
	"Url",
	"Window",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
winreg = "0.56"
